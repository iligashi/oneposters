name: Bug report
description: Something on the site or in the admin doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issue?** Don't open an issue. Report it privately as described in SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /checkout
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Storefront, Studio, Checkout, Account / sign-in, Admin, Other]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Production / preview URL, browser and device"
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
      description: Don't include customer personal data, passwords or keys.
